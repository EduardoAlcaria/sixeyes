# Server-deploy path only. The local path is now native - see docs/runbook-native.md.
# Kept working alongside the native migration: the /api/v1 prefix moved from the servlet
# context path into WebConfig, so external URLs and this nginx proxy are unchanged.
services:

  db:
    image: postgres:16-alpine
    container_name: sixeyes-db
    restart: unless-stopped
  
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - sixeyes-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-backend:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: sixeyes-python
    restart: unless-stopped

    expose:
      - "9999"
    volumes:
      - ${DOWNLOAD_PATH:-./downloads}:/app/downloads
      - agent-state:/app/state
      - C:/:/host/C
      - D:/:/host/D
    networks:
      - sixeyes-net
    environment:
      - DOWNLOAD_PATH=/app/downloads
      # Browsing spans every mounted drive read-only; writes are confined to this list.
      - ALLOWED_WRITE_ROOTS=${ALLOWED_WRITE_ROOTS:-/app/downloads}
      - STATE_DIR=/app/state
      # The agent refuses to start unauthenticated - any process reaching port 9999 could
      # otherwise drive filesystem browse and mkdir with no credentials.
      - AGENT_KEY=${AGENT_KEY:?AGENT_KEY must be set}
    healthcheck:
   
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9999/python/test || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  java-backend:
    build:
      context: ./java/controller
      dockerfile: Dockerfile
    container_name: sixeyes-java
    restart: unless-stopped
    ports:
      - "9090:9090"
    depends_on:
      python-backend:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - sixeyes-net
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      # Defaults to loopback for the native run; in a container that would make the
      # published port unreachable.
      - SERVER_ADDRESS=0.0.0.0
      - PYTHON_SERVICE_URL=http://sixeyes-python:9999
      - AGENT_KEY=${AGENT_KEY:?AGENT_KEY must be set}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DB_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET}
      # Auto-install runs a Windows .exe; a Linux container cannot. Native only.
      - INSTALL_ENABLED=false
    healthcheck:
  
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/api/v1/torrents/test || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./js
      dockerfile: Dockerfile
    container_name: sixeyes-frontend
    restart: unless-stopped
    ports:
      - "4000:80"
    depends_on:
      - java-backend
    networks:
      - sixeyes-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sixeyes-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - frontend
    networks:
      - sixeyes-net

networks:
  sixeyes-net:
    driver: bridge

volumes:
  db-data:
  agent-state:
